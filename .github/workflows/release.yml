name: Release

# 发行流程（2026-09-22 起，#232）：**打 tag 即发行**。
#
#   合并 PR 进 main → 版本号提交合入 → `git tag v0.2.7-X && git push origin v0.2.7-X`
#   → 本工作流自动构建发行包并上传到该 tag 的 GitHub Release。
#
# tag 触发时两道 fail-fast 守卫：
#   1. 版本一致性——tag 名（去 v）必须等于 package.json 与 src-tauri/tauri.conf.json 的
#      `version`（zip/manifest 的版本号来自 tauri.conf，tag 只是 git 引用，二者错位即静默错发）；
#   2. main 归属——tag 所在提交必须是 origin/main 的祖先：发行内容必须经过 PR CI 全绿，
#      打在未合并分支上的 tag 不予发行。
#
# workflow_dispatch 保留为**预演入口**：在分支上 dispatch 只构建、不发布（发布步骤由下方
# `if` 门住），产物改为上传为 run artifact（7 天过期、缺文件即红）——否则预演与「发布步骤
# 静默失败」都表现为绿 run 且零产出，无法区分（2026-09-29 main 上 dispatch 实测踩坑）；
# 在 tag ref 上 dispatch 则与 tag 推送等价（用于 CI 失败后的重试）。
#
# 历史：`push: tags` 曾于 2026-09-18 移除——当时流程是「本地构建 → 先传资产 → 后打 tag」，
# tag 触发纯属重复（0.2.0~0.2.2 三次 run 均中途取消、零产出）。2026-09-22 随 #228 发行
# 实践恢复 tag 触发并倒转流程：本地 `bun run release:portable` 退役为预演/应急手段
# （G 盘满时须 CARGO_TARGET_DIR 落 D 盘，pack_release.py 已同源适配）。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 同 tag 重推排队而非互杀：发行构建重复跑无害（softprops 幂等更新），互杀反而可能
# 把一次半途的发行停在上传前。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: 构建发行包并发布
    runs-on: windows-latest
    steps:
      # main 归属守卫需要完整历史做 merge-base 判定（发行低频，全量克隆代价可接受）
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 运行模式标注：tag=正式发行，分支 dispatch=预演。写进 step summary，
      # 避免「绿 run 但没发版」被误读为发布失败。
      - name: 运行模式标注
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            summary="## Release：正式发行（tag \`${GITHUB_REF#refs/tags/}\`）"$'\n'"构建成功后上传到该 tag 的 GitHub Release。"
          else
            summary="## Release：预演（dispatch @ \`${GITHUB_REF#refs/heads/}\`，构建版本 \`v${version}\`）"$'\n'"只构建，产物上传为 **run artifact**（7 天过期），**不发布 GitHub Release**。"$'\n'"正式发行：版本号落位后从 main 打 \`v${version}\` tag（打 tag 即发行）。"
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          echo "$summary"

      - name: 版本一致性守卫（tag = package.json = tauri.conf.json）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          pkg_version=$(node -p "require('./package.json').version")
          conf_version=$(node -p "JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version")
          echo "tag=$tag package.json=$pkg_version tauri.conf.json=$conf_version"
          if [ "$tag" != "v$pkg_version" ]; then
            echo "::error::tag $tag 与 package.json 版本 v$pkg_version 不一致——请改版本号后重打 tag"
            exit 1
          fi
          if [ "$pkg_version" != "$conf_version" ]; then
            echo "::error::package.json ($pkg_version) 与 tauri.conf.json ($conf_version) 版本不一致"
            exit 1
          fi

      - name: main 归属守卫（tag 提交必须是 origin/main 祖先——发行内容必经 PR CI）
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag 提交已在 main：$(git log --oneline -1 "$GITHUB_SHA")"
          else
            echo "::error::tag 所在提交不在 origin/main——请在 PR 合并后从 main 打 tag"
            exit 1
          fi


      # P46：bun 负责依赖安装与脚本编排（bun.lock 冻结安装）；vite/vitest 仍由 Node 宿主
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # wasm32 是 build:wasm（前端计算核 glue）的目标三元组；只给 MSVC 会在打包链第一步死
          targets: x86_64-pc-windows-msvc, wasm32-unknown-unknown
          components: clippy

      # 项目锁 MSVC；runner 自带 MSVC，显式覆盖确保链接。
      - name: 使用 MSVC 工具链
        run: rustup override set stable-x86_64-pc-windows-msvc

      # #184：Windows runner 的 Defender 实时扫描对 target 目录的指纹校验与
      # 编译 I/O 征重税。对 ephemeral runner 排除编译目录是常规提速手段，
      # 只作用于本次运行的隔离环境。
      - name: Defender 排除编译目录（target / cargo home）
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}\src-tauri\target"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.cargo"

      # #413：发行链此前每版从零冷编（26 分钟基线）。与 ci.yml 同纪律：
      # workspace 单 target 目录整树缓存；tag 版本号 bump 改 Cargo.lock 时按
      # restore 前缀恢复最近一次缓存，cargo 只重编 workspace crate 与链接。
      # #184：分支副本膨胀由 cache-cleanup.yml 每日清（非 main ref 且 2 天未访问）。
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri

      # #406：release 链的 `bun run build` 以 build:wasm 起步，runner 缺 wasm 工具链时
      # 打包第一步即死——v0.2.7 起 tag 触发的发行 run 因此五连败。步骤与 ci.yml 同名步骤一致。
      - name: 安装 wasm-pack（#220 前端构建前置）
        shell: bash
        run: |
          set -euo pipefail
          # 别把 $RUNNER_TEMP 交给 tar：Windows runner 上它是 `D:\a\_temp`，GNU tar 把
          # `D:` 当远端主机说明，报 "Cannot connect to D: resolve failed"（实测
          # run 35534781451）。mktemp 给的是冒号无关的 POSIX 路径，绕开这一层。
          work="$(mktemp -d)"
          curl -fsSL -o "$work/wasm-pack.tar.gz" \
            https://github.com/rustwasm/wasm-pack/releases/download/v0.14.0/wasm-pack-v0.14.0-x86_64-pc-windows-msvc.tar.gz
          tar xzf "$work/wasm-pack.tar.gz" -C "$work"
          mkdir -p "$USERPROFILE/.cargo/bin"
          cp "$work/wasm-pack-v0.14.0-x86_64-pc-windows-msvc/wasm-pack.exe" "$USERPROFILE/.cargo/bin/"

      # #413：wasm 产物缓存与 ci.yml 同 key 结构（compute 源码建 key；命中即连 cargo
      # 编译都省掉）。版本号 bump 改 Cargo.lock 时靠 restore 前缀恢复最近一次产物。
      - uses: actions/cache@v4
        with:
          path: src/wasm
          key: wasm-${{ runner.os }}-${{ hashFiles('src-tauri/pylon-compute/**', 'src-tauri/pylon-canonical-types/**', 'src-tauri/Cargo.toml', 'src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备并验证发行输入
        run: bun run prepare:release

      # 打包脚本自测（发行前）：三处版本一致性 + docs/说明书/ 全量收集契约。
      # 零新依赖：下一步 pack_release.py 本来就要 python。
      - name: 打包脚本自测（scripts/tests）
        run: bun run test:pack

      # 完整便携链：前端 build + tauri --no-bundle + pylon-detect + pack_release.py
      # 产物：release/pylon-<version>-win64.zip + .sha256 + .manifest.json
      - name: 打包发行包
        run: bun run release:portable

      # 预演模式的产物去留：不上 Release，但必须留痕为 run artifact（可下载、7 天过期）。
      # if-no-files-found: error 把「打包没产出」从静默绿变成红——预演与静默失败自此可区分。
      - name: 预演产物上传（run artifact）
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: pylon-preview-win64
          path: |
            release/pylon-*-win64.zip
            release/pylon-*-win64.zip.sha256
            release/pylon-*-win64.manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/pylon-*-win64.zip
            release/pylon-*-win64.zip.sha256
            release/pylon-*-win64.manifest.json
          generate_release_notes: true
