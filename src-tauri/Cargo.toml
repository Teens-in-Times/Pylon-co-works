[package]
name = "pylon"
version = "0.4.0-SLD"
edition = "2021"
description = "Prism Desktop - AI Agent GUI"
default-run = "pylon"

# #106 P0：workspace 化——4 crate 单 Cargo.lock 单 target 目录。
# 关闭两个质量洞：① 子 crate 各自的 Cargo.lock 使 clippy/fmt 跑在与发行包不同
# 的依赖版本上（版本漂移）；② CI 的 `cargo test --lib` 只跑主 crate，子 crate
# 内嵌测试从未在 CI 执行（测试黑洞）。resolver 2 为 edition 2021 语义的显式化。
# workspace 根 = src-tauri，target 目录位置不变。
[workspace]
# #220 WP1/WP2：pylon-canonical-types 是 canonical 事件 wire 契约的单源，
# pylon-compute 是前端计算核（wasm-bindgen 出口）。两者都落本 workspace，
# 才能被 check:rust 的 `cargo test --workspace --lib` 与 `cargo fmt --all` 覆盖；
# 另起 workspace 会让它们脱离门禁（#106 P0 关掉的那类测试黑洞）。
members = [
    ".",
    "pylon-core",
    "pylon-acp",
    "pylon-session",
    "pylon-foundations",
    "pet-core",
    "pylon-canonical-types",
    "pylon-compute",
    "pylon-markdown",
    # #382：测试夹具独立成 crate——依赖只有 serde_json。留在主 crate 里当 [[bin]]
    # 会被 Cargo 的「包内 bin 隐式链接本包 lib」规则拖去编译整棵 Tauri 依赖树
    # （CI 实测 405 crate / 5m26s，而夹具源码只 use serde_json + std）。
    "pylon-fake-agent",
]
resolver = "2"

# 性能卫生 lint 清单（#414）：把默认 allow 的 nursery lint 提编进基线棘轮。
# 默认已 warn 的 await_holding_lock / await_holding_refcell_ref /
# regex-creation-in-loops 不重复登记；「tokio 锁卫跨 .await」走仓库根
# clippy.toml 的 await-holding-invalid-types。执行语义仍是「相对
# artifacts/clippy-baseline.json 零新增」（AGENTS.md §2.4）。
# 新增 member crate 必须接 [lints] workspace = true，否则清单对该 crate 不生效。
[workspace.lints.clippy]
# nursery 提编：深拷贝机械半区（已知有少量误报，个案 allow 需注明原因）
redundant_clone = "warn"

# 本包（pylon）同样接入 workspace 清单；各 member crate 同此。
[lints]
workspace = true

[package.metadata]
authors = ["Pylon Contributors"]

[package.metadata.tauri-winres]
FileDescription = "Prism Desktop"

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
pylon-pet-core = { path = "pet-core" }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.23"
rand = "0.10"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-rustls = "0.26"
rustls = "0.23"
rustls-native-certs = "0.8"
futures-util = "0.3"
infer = "0.22"
url = "2"
# issue #82：Agent 浏览器 CDP 通道（WebView2 CallDevToolsProtocolMethod；版本对齐 wry 0.55 依赖树）
webview2-com = "0.38"
windows = "0.61"
log = "0.4"
# R2 错误类型化：PylonError Display/Error 由 derive 生成（DTO 序列化仍手写）
thiserror = "2"
# 官方 ACP schema（v1 + v2 类型全集）——消除手写协议参数构造
# A1a 时声明 1.7；#348 A2 起声明与 lock 实际解析一致（^1.9.1）。1.7→1.9 实质
# delta：notices/compaction 为 feature 门控新增、tool_call_name 转正；
# session_resume 为标准；session_fork 仍在 unstable_session_fork 后。
agent-client-protocol-schema = "1.9.1"
# A1a：官方 SDK 连接引擎（D1=①）——引擎落点见施工书 §0（新 crate pylon-acp，纯逻辑不进主 crate）
# A1a 时声明 2.1.0；#348 A2 起声明与 lock 实际解析一致（^2.2.0）。
agent-client-protocol = "2.2.0"
dashmap = "6.2.1"
encoding_rs = "0.8.35"
regex = "1.13.1"
backon = "1.6.0"
shell-words = "1.1"
tokio-util = { version = "0.7.19", features = ["rt", "compat"] }
ringbuffer = "0.16.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# #362：落盘 sink 的异步 writer（non_blocking 的 channel + worker 线程）。轮转与
# 每日预算由 src/logging/ 自己实现——文件名必须与 panic hook 共用一份计算，不能
# 依赖本 crate 的命名格式。
tracing-appender = "0.2"
serde_yml = "0.0.13"
sha2 = "0.10"
pylon-acp = { path = "pylon-acp" }
pylon-core = { path = "pylon-core" }
pylon-foundations = { path = "pylon-foundations" }
pylon-session = { path = "pylon-session" }
# #220 WP1：canonical 事件 wire 契约的单源。写入侧（session/event_repo.rs）与
# WASM 计算核（pylon-compute）共用同一份词表与 identity 推导纪律。
pylon-canonical-types = { path = "pylon-canonical-types" }
chrono = "0.4.45"
windows-sys = { version = "0.61.2", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# #208 ④：Windows 上「海量小对象、短生命周期」的 Rust 侧（逐行 payload 解码 / 归一化）
# 用 mimalloc 替换系统分配器；收益以 storage 基准实测为准，不达标即撤（见开发记录）。
mimalloc = { version = "0.1", default-features = false }
# I06-A-DATA-01：SQLite 消息仓库（bundled 离线编译，无系统 sqlite 依赖）
# cache：启用 prepare_cached 语句缓存——canonical_events 热路径（append/ingest）
# 免去每次 execute 重新编译 SQL。
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache"] }
# I12-W3：Gateway 凭据 AES-256-GCM envelope 与主密钥归零（用户 2026-08-11 授权新增）
aes-gcm = "0.10"
zeroize = { version = "1", features = ["derive"] }
# P53 D6：zip/URL 安装源（仅 deflate，避免无用编解码器）
zip = { version = "8", default-features = false, features = ["deflate"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dev-dependencies]
tauri = { version = "2", features = ["test", "unstable"] }
# #106 P5：tests/ 集成目标是独立 crate，按需声明（与常规依赖同版本）。
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# #484：pylon-session 的 tombstone_state 测试断言 API 仅在 test-support feature 下存在，
# 经 dev-dependencies union 进测试构建；生产（cargo build）不含该 feature 与方法。
pylon-session = { path = "pylon-session", features = ["test-support"] }

# #106 P1：测试专用假 ACP agent 见 `pylon-fake-agent` member crate（#382 迁出：
# 同包 bin 会隐式链接本 crate 的 lib，编一个 2100 行夹具要连带整棵 Tauri 依赖树）。
# 本 feature 仍留主 crate：test-agent 联动 tauri/test——P5 门面（test_harness）
# 在 feature 构建下也要用 mock runtime，普通依赖的 feature 才能进 lib 的非 dev
# 编译（dev-dependencies 只覆盖 cfg(test) 与 tests/ 目标本体）。
[features]
test-agent = ["tauri/test"]

# #106 P5：集成测试单 target（harness 即门面，见 src/test_harness.rs 模块文档）。
[[test]]
name = "integration"
path = "tests/integration.rs"
required-features = ["test-agent"]

[lib]
name = "prism_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[profile.release]
# 发布瘦身：去除符号表（实测 -18MB，零运行时影响）
strip = true
# 2026-09-07 Riccati：崩溃直接终止（桌面 app 无 FFI 抓 panic 场景），省异常展开表
panic = "abort"
# 跨 crate 死代码消除 + 内联（thin 相对 full 增量友好），体积/速度双收
lto = "thin"
