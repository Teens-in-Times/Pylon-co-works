[package]
name = "pylon-acp"
version = "0.4.1-XFN"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync", "io-util", "macros", "fs"] }
futures-util = "0.3"
thiserror = "2"
base64 = "0.23"
tokio-util = { version = "0.7", features = ["compat"] }
# #348 A2：声明与 Cargo.lock 实际解析一致（schema 1.9.1 / acp 2.2.0；caret 约束策略不变）
agent-client-protocol-schema = "1.9.1"
regex = "1"
ringbuffer = "0.16"
infer = "0.22"
tracing = "0.1"
agent-client-protocol = "2.2.0"
pylon-core = { path = "../pylon-core" }
pylon-foundations = { path = "../pylon-foundations" }

[target.'cfg(windows)'.dependencies]
# JobObjects feature 随 #486 项5（装配单源下沉 pylon-foundations）裁掉；
# Threading 仍被 spawn_exit_watcher（OpenProcess/WaitForSingleObject）使用。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Storage_FileSystem"] }

# #414：接入 workspace 级 lint 清单（src-tauri/Cargo.toml [workspace.lints]）。
[lints]
workspace = true
