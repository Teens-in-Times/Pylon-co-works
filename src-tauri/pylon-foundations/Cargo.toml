[package]
license = "AGPL-3.0-only"
name = "pylon-foundations"
version = "1.0.0"
edition = "2021"
description = "Pylon pure-logic foundations — event name table, sanitization, timestamps, workspace search and git porcelain (no Tauri/AppState dependencies)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1.13.1"
thiserror = "2"
encoding_rs = "0.8.35"
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros"] }

# #317 批次二 ③：原子写正身（MoveFileExW 替换）下沉本 crate 所需的 Windows 原语。
# #486 项5：JobObject 装配单源（job_object.rs）追加 Foundation/JobObjects 两 feature。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
] }

# #361 的差分验收要给子进程读 `GetConsoleWindow()`（证明 CREATE_NO_WINDOW 真的
# 让控制台窗口句柄变成 NULL）。只测试需要，所以放 dev-dependencies——发行构建不带
# 这份 UI 绑定。
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

# #414：接入 workspace 级 lint 清单（src-tauri/Cargo.toml [workspace.lints]）。
[lints]
workspace = true
