[package]
license = "AGPL-3.0-only"
name = "pylon-core"
version = "1.0.0"
edition = "2021"
description = "Pylon standalone library — agent catalog/detection and CLI client (no Tauri/GUI dependencies)"

[dependencies]
# #361：子进程 spawn 的 Windows 控制台收口（`HideConsoleWindow`）住 pylon-foundations。
# 新边方向为向下（foundations 不依赖任何本仓 crate，不存在环）：探测/诊断类 spawn
# 同样会弹黑框，若只在 pylon-acp 收口就会漏掉 agent 探测与 reg.exe 这些路径。
pylon-foundations = { path = "../pylon-foundations" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.13"
sha2 = "0.11"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["process", "time", "rt", "net", "sync", "io-util", "macros"] }
futures-util = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# JobObjects feature 随 #486 项5（JobObject 装配单源下沉 pylon-foundations）裁掉；
# Foundation/Threading 仍被 agent_detection 的测试探针（CloseHandle/OpenProcess）使用。
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

# #414：接入 workspace 级 lint 清单（src-tauri/Cargo.toml [workspace.lints]）。
[lints]
workspace = true
